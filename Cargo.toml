[workspace]
resolver = "2"
members = [
    "imgproc-core",
    "imgproc-ops",
    "imgproc-io",
    "imgproc-pipeline",
    "imgproc-cli",
    "imgproc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Image Processing Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/imgproc"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Image processing
image = "0.24"
ndarray = "0.16"
rayon = "1.10"
num-traits = "0.2"
num-complex = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }

# CLI dependencies
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
indicatif = "0.17"
colored = "2.1"
env_logger = "0.11"
log = "0.4"

# Async (for specific crates that need it)
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"

# Development dependencies
criterion = "0.5"
proptest = "1.4"
approx = "0.5"
tempfile = "3.10"
pretty_assertions = "1.4"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"