# Morphological Analysis Pipeline
# Applies morphological operations for shape analysis

version: "1.0"
name: "morphological_analysis"
description: "Pipeline for morphological image analysis"

variables:
  image_size: 512
  threshold_value: 128
  morph_kernel: 5

pipeline:
  - operation: grayscale
    name: "to_gray"

  - operation: resize
    name: "resize"
    params:
      width: ${image_size}
      height: ${image_size}
      interpolation: nearest

  - operation: threshold
    name: "binarize"
    params:
      threshold: ${threshold_value}
      max_value: 255
      type: binary

  - operation: erode
    name: "erode"
    params:
      kernel_size: ${morph_kernel}
      element: ellipse

  - operation: dilate
    name: "dilate"
    params:
      kernel_size: ${morph_kernel}
      element: ellipse

  - operation: opening
    name: "opening"
    params:
      kernel_size: 3
      element: rectangle

  - operation: closing
    name: "closing"
    params:
      kernel_size: 3
      element: rectangle

error_handling:
  on_error: stop
  log_errors: true

output:
  format: png
  save_intermediates: true
  intermediate_dir: "morph_steps"
