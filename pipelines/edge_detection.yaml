# Edge Detection Pipeline
# Prepares image for edge detection with noise reduction and applies Canny

version: "1.0"
name: "edge_detection"
description: "Comprehensive edge detection pipeline with preprocessing"

variables:
  size: 1024
  blur_sigma: 1.0
  canny_low: 50
  canny_high: 150

pipeline:
  - operation: grayscale
    name: "to_grayscale"

  - operation: resize
    name: "standardize_size"
    params:
      width: ${size}
      height: ${size}
      interpolation: bilinear

  - operation: gaussian_blur
    name: "reduce_noise"
    params:
      kernel_size: 5
      sigma: ${blur_sigma}

  - operation: canny
    name: "detect_edges"
    params:
      low_threshold: ${canny_low}
      high_threshold: ${canny_high}

error_handling:
  on_error: stop
  log_errors: true

output:
  format: png
  save_intermediates: true
  intermediate_dir: "intermediates"
